<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0 auto;
        padding: 20px;
        max-width: 900px; /* This keeps it from stretching to the whole page */
        background-color: #f4f4f9;
    }

    .container {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
</style>
<div class="container">
    <a href="/">⬅ Back to Dashboard</a>
    <h1>Manage Quick Add Buttons</h1>
    <br>

    <form id="quick-add-form" action="/add_quick_add" method="POST" style="margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap;">
        <input type="text" name="name" id="edit-name" placeholder="Item Name (e.g. Eggs x2)" required style="flex: 1; padding: 10px;">
        <input type="number" name="calories" id="edit-cals" placeholder="Cals" required style="width: 80px; padding: 10px;">
        <input type="number" step="0.1" name="protein" id="edit-prot" placeholder="Prot" required style="width: 80px; padding: 10px;">
        <button type="submit" id="submit-btn" style="background-color: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">Add Button</button>
    </form>

    <div style="max-height: 450px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
        {% for item in all_quick_add_items %}
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee;">
                <span>
                    <strong>{{ item.name }}</strong>
                    <span style="margin-left: 10px; color: #666;">{{ item.calories }} kcal</span>
                    <span style="margin-left: 10px; color: #9c27b0; font-weight: bold;">{{ item.protein }}g Prot</span>
                </span>
                
                <div style="display: flex; gap: 15px; align-items: center;">
                    <button type="button" 
                            onclick="editQuickItem('{{ item.name }}', '{{ item.calories }}', '{{ item.protein }}')"
                            style="background: none; border: none; color: #1a73e8; cursor: pointer; font-weight: bold; font-size: 0.9em;">
                        Edit
                    </button>

                    <a href="/delete_quick_add/{{ item.id }}" style="color: #ea4335; text-decoration: none; font-weight: bold;">[x]</a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

<script>
function editQuickItem(name, cals, protein) {
    // Fill the inputs
    document.getElementById('edit-name').value = name;
    document.getElementById('edit-cals').value = cals;
    document.getElementById('edit-prot').value = protein;
    
    // Visual feedback: change button color and text
    const btn = document.getElementById('submit-btn');
    btn.innerText = "Update Button";
    btn.style.backgroundColor = "#34a853"; // Green for update
    
    // Focus and scroll
    document.getElementById('edit-name').focus();
    window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>
