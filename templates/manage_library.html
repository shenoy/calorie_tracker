<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0 auto;
        padding: 20px;
        max-width: 900px; /* This keeps it from stretching to the whole page */
        background-color: #f4f4f9;
    }

    .container {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
</style>
<div class="container">
    <a href="/">⬅ Back to Dashboard</a>
    <h1>Food Library Manager</h1>
    <p><small>Add foods here to use them in the Precision Calculator.</small></p>

    <form action="/add_to_library" method="POST" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" name="library_name" placeholder="Food Name (e.g. Banana)" required style="flex: 2; padding: 10px;">
        <input type="number" step="0.1" name="library_cals" placeholder="Cals/100g" required style="width: 110px; padding: 10px;">
        <input type="number" step="0.1" name="library_protein" placeholder="Prot/100g" required style="width: 110px; padding: 10px;">
        <button type="submit" style="padding: 10px 20px; background-color: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer;">Save</button>
    </form>

    <div style="background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; max-height: 500px; overflow-y: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.9em;">
            <thead>
                <tr style="text-align: left; border-bottom: 1px solid #eee;">
                <th>Food Name</th>
                <th>Cals/100g</th>
                <th>Prot/100g</th>
                <th style="padding-left: 10px;">Actions</th> </tr>
            </thead>
            <tbody>
                {% for food_item in library_items_list %}
                <tr style="border-bottom: 1px solid #f9f9f9;">
                    <td style="padding: 10px 0;"><strong>{{ food_item.name }}</strong></td>
                    <td>{{ food_item.calories_per_100g }} <small>kcal</small></td>
                    <td style="color: #9c27b0; font-weight: bold;">{{ food_item.protein_per_100g }}g</td>
                    <td style="display: flex; gap: 10px;">
                        <button type="button"
                                onclick="editFood('{{ food_item.name }}', '{{ food_item.calories_per_100g }}', '{{ food_item.protein_per_100g }}')"
                                style="background: none; border: none; color: #1a73e8; cursor: pointer; font-weight: bold; font-size: 0.9em;">
                            Edit
                        </button>

                        <a href="/delete_library_item/{{ food_item.id }}"
                           style="color: #ff4d4d; text-decoration: none; font-weight: bold;"
                           onclick="return confirm('Delete {{ food_item.name }}?')">
                           [x]
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<script>
function editFood(name, cals, protein) {
    // Fill the form fields
    document.getElementsByName('library_name')[0].value = name;
    document.getElementsByName('library_cals')[0].value = cals;
    document.getElementsByName('library_protein')[0].value = protein;

    // Focus on the name field and scroll up
    document.getElementsByName('library_name')[0].focus();
    window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>
